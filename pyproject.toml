[project]
name = "earshot"
version = "0.1.0"
description = "Speak-or-hold engine and eval harness for an always-listening AI in your ear"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["earshot"]
